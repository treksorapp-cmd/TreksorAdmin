name: Refresh dependency lockfile
on:
  pull_request:
    paths:
      - package.json
      - .github/workflows/refresh-lockfile.yml
permissions:
  contents: write
jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'backend/supabase-foundation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm install --package-lock-only --ignore-scripts --no-audit
      - run: npm audit fix --package-lock-only --ignore-scripts --no-fund || echo "Remaining advisories require manual upgrades; retaining audit gate in validation"
      - name: Commit lockfile only if changed
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "build: synchronize npm lockfile with package manifest"
          git push origin HEAD:backend/supabase-foundation
