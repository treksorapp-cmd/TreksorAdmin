name: Admin validation
on:
  pull_request:
    paths:
      - "**/*.ts"
      - "**/*.tsx"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/admin-validation.yml"
  workflow_dispatch:
jobs:
  typecheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
        env:
          SUPABASE_URL: https://example.supabase.co
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-real-key
      - run: npm audit --omit=dev --audit-level=high

